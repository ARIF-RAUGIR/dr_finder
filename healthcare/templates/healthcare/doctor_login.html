{% extends 'base.html' %}
{% load static %}
{% block title %}Doctor Login{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card login-card shadow p-4">

        <div class="text-center mb-4">
          <h3 class="fw-bold text-primary">Dr.Finder</h3>
          <p class="text-muted">Doctor Login</p>
        </div>

        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Email or Phone Number</label>
            <input type="text" name="login_input" class="form-control"
                   placeholder="Enter email or phone number" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
          </div>

          <div class="d-flex justify-content-between mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox">
              <label class="form-check-label">Remember me</label>
            </div>
            <a href="#" class="text-decoration-none">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>

          <p class="text-center mb-0">
            Don't have an account?
            <a href="{% url 'doctor_signup' %}" class="text-decoration-none">Sign up</a>
          </p>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
