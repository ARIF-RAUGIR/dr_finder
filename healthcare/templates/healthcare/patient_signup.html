{% extends 'base.html' %}
{% load static %}
{% block title %}Patient Sign Up{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow p-4">

        <div class="text-center mb-4">
          <h3 class="fw-bold text-primary">Dr.Finder</h3>
          <p class="text-muted">Create Patient Account</p>
        </div>

        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" placeholder="Enter full name" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="Enter email" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" name="phone" class="form-control" placeholder="Enter phone number" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password1" class="form-control" placeholder="Enter password" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="password2" class="form-control" placeholder="Confirm password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3">Sign Up</button>

          <p class="text-center mb-0">
            Already have an account?
            <a href="{% url 'patient_login' %}" class="text-decoration-none">Login</a>
          </p>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
